<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-labelledby="t d">
  <title id="t">Imify</title>
  <desc id="d">Imify logo: a photo inside a magnifying-glass lens with scan-frame corners, next to the Imify wordmark.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#38e1c8"/>
    </linearGradient>
    <linearGradient id="brandText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8aa3ff"/>
      <stop offset="1" stop-color="#38e1c8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a33"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a55"/>
      <stop offset="1" stop-color="#14203f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#6c8cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lens"><circle cx="112" cy="108" r="50"/></clipPath>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="880" height="240" rx="28" fill="url(#card)"/>
  <rect x="0" y="0" width="880" height="240" rx="28" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="878.5" height="238.5" rx="27.25" fill="none" stroke="#24305a" stroke-width="1.5"/>

  <!-- mark -->
  <g transform="translate(36 12)">
    <!-- scan-frame corners -->
    <g fill="none" stroke="url(#brand)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 58V36a14 14 0 0 1 14-14h22"/>
      <path d="M154 22h22a14 14 0 0 1 14 14v22"/>
      <path d="M22 158v22a14 14 0 0 0 14 14h22"/>
    </g>
    <!-- the photo, seen through the lens -->
    <g clip-path="url(#lens)">
      <rect x="56" y="52" width="112" height="112" fill="url(#sky)"/>
      <circle cx="96" cy="82" r="10" fill="#38e1c8"/>
      <path d="M56 164V140l30-36 26 30 20-20 36 40v10z" fill="#6c8cff"/>
      <path d="M86 104l26 30-22 30H56v-24z" fill="#4f6be0"/>
    </g>
    <!-- lens ring + handle -->
    <circle cx="112" cy="108" r="50" fill="none" stroke="url(#brand)" stroke-width="9"/>
    <path d="M148 144l38 38" stroke="url(#brand)" stroke-width="15" stroke-linecap="round"/>
    <!-- match tick -->
    <circle cx="150" cy="72" r="17" fill="#0a0e1a" stroke="#38e1c8" stroke-width="4"/>
    <path d="M142 72l6 6 11-12" fill="none" stroke="#38e1c8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="268" y="134" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-2" fill="url(#brandText)">Imify</text>
  <text x="272" y="180" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="4.5" fill="#9aa5c4">SELF-HOSTED REVERSE IMAGE SEARCH</text>
</svg>
