[project]
name = "imify"
version = "0.1.0"
description = "Imify — self-hosted reverse image search. Own index, SearXNG discovery, StrikeDB storage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "Pillow>=11.0",
    "numpy>=2.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Optional accelerated / self-hosted layers (all degrade cleanly when absent):
#   uv sync --extra face --extra ocr
face = [
    "onnxruntime>=1.19",
    "opencv-python-headless>=4.8",
]
ocr = [
    "pytesseract>=0.3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.uv]
package = true
